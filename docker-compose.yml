# Local development only — the deployed site runs on Vercel (see docs/DEPLOY.md).
# What this buys over `flask run` is the same Postgres the deployed site talks to, and
# an uploads volume, so the content editor can be exercised end to end offline.
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trackproduce-web-app
    environment:
      - DATABASE_URL=postgresql://trackproduce:${POSTGRES_PASSWORD:-trackproduce}@db:5432/trackproduce
      - UPLOAD_FOLDER=/app/uploads
      - FLASK_DEBUG=0
      - SITE_URL=http://localhost:7015
      # The content editor's login. Unset, the panel refuses every password.
      - SECRET_KEY=${SECRET_KEY:-}
      - SITECOPY_PASSWORD=${SITECOPY_PASSWORD:-}
    ports:
      - "7015:7015"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - uploads:/app/uploads

  db:
    image: postgres:16
    container_name: trackproduce-web-db
    environment:
      - POSTGRES_DB=trackproduce
      - POSTGRES_USER=trackproduce
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-trackproduce}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trackproduce -d trackproduce"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  pgdata:
  uploads:
